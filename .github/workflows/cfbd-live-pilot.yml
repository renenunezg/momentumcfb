name: CFBD live feed pilot

on:
  workflow_dispatch:
    inputs:
      season:
        required: true
        default: '2026'
        type: string
      week:
        required: true
        type: string
      game_id:
        description: One game from the frozen forecast artifact
        required: true
        type: string
      forecast_run_id:
        description: Successful weekly update containing the pregame forecast
        required: true
        type: string
      polls:
        description: One-minute polls, maximum 20; at most 40 CFBD requests
        required: true
        default: '20'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cfbd-live-pilot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      SEASON: ${{ inputs.season }}
      WEEK: ${{ inputs.week }}
      GAME_ID: ${{ inputs.game_id }}
      POLLS: ${{ inputs.polls }}
      PLAYER_RUNTIME_BUNDLE_URL: ${{ vars.PLAYER_RUNTIME_BUNDLE_URL }}
      PLAYER_RUNTIME_BUNDLE_SHA256: ${{ vars.PLAYER_RUNTIME_BUNDLE_SHA256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install poetry==2.1.3
          poetry install --no-root --no-interaction --no-ansi
      - uses: actions/download-artifact@v7
        with:
          name: weekly-cfb-${{ inputs.forecast_run_id }}
          run-id: ${{ inputs.forecast_run_id }}
          github-token: ${{ github.token }}
          path: backend/data/pilot-forecast/
      - name: Restore frozen baseline and capture one game
        run: |
          poetry run python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          from backend.cli import main
          from backend.players.artifacts import install_runtime_bundle

          season, week = int(os.environ['SEASON']), int(os.environ['WEEK'])
          polls = int(os.environ['POLLS'])
          if not 1 <= polls <= 20:
              raise ValueError('The pilot is limited to 20 polls and 40 calls')
          url = os.environ['PLAYER_RUNTIME_BUNDLE_URL']
          expected = os.environ['PLAYER_RUNTIME_BUNDLE_SHA256']
          if not url.startswith('https://') or len(expected) != 64:
              raise ValueError('A reviewed HTTPS runtime bundle is required')
          with urlopen(url, timeout=30) as response:
              bundle = response.read(10_000_001)
          if len(bundle) > 10_000_000 or hashlib.sha256(bundle).hexdigest() != expected:
              raise ValueError('Runtime bundle checksum or size mismatch')
          install_runtime_bundle(bundle, season)
          files = sorted(Path('backend/data/pilot-forecast').glob(f'{season}_{week:02d}_*/projections.parquet'))
          if not files:
              raise ValueError('No matching frozen pregame forecast')
          main(['cfbd-live-pilot', '--season', str(season), '--week', str(week),
                '--game-ids', os.environ['GAME_ID'], '--forecast', str(files[-1]),
                '--polls', str(polls), '--interval', '60', '--max-calls', '40',
                '--compare-espn'])
          PY
      - name: Preserve pilot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cfbd-live-pilot-${{ github.run_id }}
          path: |
            backend/data/raw/tier2/
            backend/data/processed/live_cfbd/
          retention-days: 90
          if-no-files-found: ignore
