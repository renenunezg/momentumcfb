name: Code quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.1.3

      - name: Install dependencies
        run: poetry install --no-root --no-interaction --no-ansi

      - name: Validate project metadata
        run: poetry check --lock

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Lint
        run: poetry run ruff check .

      - name: Type check production boundaries
        run: poetry run mypy

      - name: Compile Python
        run: poetry run python -m compileall -q backend tests

      - name: Run tests
        run: poetry run pytest -q
