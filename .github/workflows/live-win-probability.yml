name: Live win probability

on:
  # Supabase dispatches around unfinished games only when live publication is
  # stale or the worker is nearing expiry. One publisher runs at a time.
  repository_dispatch:
    types: [live-win-probability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-win-probability
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PLAYER_RUNTIME_BUNDLE_URL: ${{ vars.PLAYER_RUNTIME_BUNDLE_URL }}
      PLAYER_RUNTIME_BUNDLE_SHA256: ${{ vars.PLAYER_RUNTIME_BUNDLE_SHA256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install poetry==2.1.3
          poetry install --no-root --no-interaction --no-ansi
      - name: Restore the frozen in-game baseline
        run: |
          poetry run python - <<'PY'
          import hashlib
          import os
          from io import BytesIO
          from pathlib import Path
          from urllib.request import urlopen
          from zipfile import ZipFile

          url = os.environ['PLAYER_RUNTIME_BUNDLE_URL']
          expected = os.environ['PLAYER_RUNTIME_BUNDLE_SHA256']
          if not url.startswith('https://') or len(expected) != 64:
              raise ValueError('A reviewed HTTPS runtime bundle is required')
          with urlopen(url, timeout=30) as response:
              bundle = response.read(10_000_001)
          if len(bundle) > 10_000_000 or hashlib.sha256(bundle).hexdigest() != expected:
              raise ValueError('Runtime bundle checksum or size mismatch')
          name = 'ingame/baseline_summary.parquet'
          target = Path('backend/data/processed') / name
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(ZipFile(BytesIO(bundle)).read(name))
          PY
      - name: Publish live snapshots
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MOMENTUMCFB_DB_WRITES: "1"
        # Hand off before the six-hour runner limit; the queued replacement
        # starts after this worker exits. Idle slates exit early. One call per
        # 30 seconds bounds a full worker at 690 CFBD calls, and the reserve keeps
        # the weekly model's quota out of reach.
        run: >-
          poetry run python -m backend live-win-probability --watch --interval 30
          --duration 20700 --publish --max-calls 720 --min-remaining 3000
