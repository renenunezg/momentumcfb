name: Refresh draft board

on:
  workflow_run:
    workflows: [Weekly CFB update]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      season:
        description: College season for the following NFL draft
        required: true
        default: '2026'
        type: string

permissions:
  contents: read

concurrency:
  group: cfb-draft-publication
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MOMENTUMCFB_DB_WRITES: '1'
      REQUESTED_SEASON: ${{ inputs.season }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install poetry==2.1.3
          poetry install --no-root --no-interaction --no-ansi
      - name: Verify draft publication contracts
        run: poetry run pytest tests/test_draft_publication.py -q
      - name: Refresh and publish the draft workspace
        shell: bash
        run: |
          season="${REQUESTED_SEASON:-$(date -u +%Y)}"
          if [[ -z "$REQUESTED_SEASON" && "$(date -u +%m)" < "03" ]]; then
            season=$((season - 1))
          fi
          poetry run python -m backend.draft.publish --season "$season"
