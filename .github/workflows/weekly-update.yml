name: Weekly CFB update

on:
  # Supabase pg_cron (cfb-weekly-update-dispatch) fires this via
  # repository_dispatch Mondays at 18:17 UTC. A failed or input-blocked
  # run is investigated and rerun deliberately instead of scheduling a
  # speculative Tuesday retry.
  repository_dispatch:
    types: [weekly-update]
  workflow_dispatch:
    inputs:
      season:
        description: Optional season override
        required: false
        type: string
      week:
        description: Optional model week override
        required: false
        type: string
      heisman_model_run_id:
        description: Run containing the versioned heisman-model-SEASON artifact (initial bootstrap)
        required: false
        type: string
      opening_forecast_run_id:
        description: Run containing the immutable opening-forecast-RUN_ID artifact
        required: false
        type: string
      player_runtime_bundle_url:
        description: HTTPS URL of an exported player runtime ZIP for initial bootstrap
        required: false
        type: string
      player_runtime_bundle_sha256:
        description: Reviewed SHA256 of the initial player runtime ZIP
        required: false
        type: string
      opening_forecast_bundle_url:
        description: HTTPS URL of the reviewed preseason runtime ZIP
        required: false
        type: string
      opening_forecast_bundle_sha256:
        description: Reviewed SHA256 of the preseason runtime ZIP
        required: false
        type: string
      max_calls:
        description: Shared CFBD call budget for this run (approval required above 100)
        required: false
        default: "100"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-cfb-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REQUESTED_SEASON: ${{ inputs.season }}
      FORECAST_WEEK: ${{ inputs.week || '' }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_API_BOOKMAKERS: ${{ secrets.ODDS_API_BOOKMAKERS }}
      ODDS_API_REGIONS: ${{ secrets.ODDS_API_REGIONS }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HEISMAN_MODEL_RUN_ID: ${{ inputs.heisman_model_run_id || vars.HEISMAN_MODEL_RUN_ID }}
      OPENING_FORECAST_RUN_ID: ${{ inputs.opening_forecast_run_id || vars.OPENING_FORECAST_RUN_ID }}
      PLAYER_RUNTIME_BUNDLE_URL: ${{ inputs.player_runtime_bundle_url || vars.PLAYER_RUNTIME_BUNDLE_URL }}
      PLAYER_RUNTIME_BUNDLE_SHA256: ${{ inputs.player_runtime_bundle_sha256 || vars.PLAYER_RUNTIME_BUNDLE_SHA256 }}

      OPENING_FORECAST_BUNDLE_URL: ${{ inputs.opening_forecast_bundle_url || vars.OPENING_FORECAST_BUNDLE_URL }}
      OPENING_FORECAST_BUNDLE_SHA256: ${{ inputs.opening_forecast_bundle_sha256 || vars.OPENING_FORECAST_BUNDLE_SHA256 }}
      CFBD_MAX_CALLS: ${{ inputs.max_calls || '100' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install poetry==2.1.3
          poetry install --no-root --no-interaction --no-ansi

      - name: Resolve season
        shell: bash
        run: |
          if [[ -n "$REQUESTED_SEASON" ]]; then
            season="$REQUESTED_SEASON"
          else
            calendar_year=$(date -u +%Y)
            calendar_month=$(date -u +%m)
            if [[ "$calendar_month" == "01" ]]; then
              season=$((calendar_year - 1))
            else
              season="$calendar_year"
            fi
          fi
          echo "SEASON=$season" >> "$GITHUB_ENV"
          echo "CFBD_USAGE_FILE=$RUNNER_TEMP/cfbd-weekly-usage.json" >> "$GITHUB_ENV"

      - name: Restore player ingestion checkpoints and trained model
        id: player-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/data/raw/players/${{ env.SEASON }}/
            backend/data/processed/players/models/
            backend/data/processed/ingame/baseline_summary.parquet
          key: cfb-players-v2-${{ env.SEASON }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cfb-players-v2-${{ env.SEASON }}-

      - name: Restore frozen preseason forecast
        id: preseason-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/data/processed/preseason/ratings/
            backend/data/processed/preseason/score_noise_prior/
            backend/data/processed/preseason/forecast_log/
          key: cfb-preseason-v1-${{ env.SEASON }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cfb-preseason-v1-${{ env.SEASON }}-

      - name: Restore pinned opening forecast artifact
        if: env.OPENING_FORECAST_RUN_ID != ''
        uses: actions/download-artifact@v7
        with:
          name: opening-forecast-${{ env.OPENING_FORECAST_RUN_ID }}
          run-id: ${{ env.OPENING_FORECAST_RUN_ID }}
          github-token: ${{ github.token }}
          path: backend/data/

      - name: Restore pinned Heisman model artifact
        if: env.HEISMAN_MODEL_RUN_ID != ''
        uses: actions/download-artifact@v7
        with:
          name: heisman-model-${{ env.SEASON }}
          run-id: ${{ env.HEISMAN_MODEL_RUN_ID }}
          github-token: ${{ github.token }}
          path: backend/data/processed/

      - name: Bootstrap reviewed runtime bundles
        if: env.PLAYER_RUNTIME_BUNDLE_URL != '' || env.OPENING_FORECAST_BUNDLE_URL != ''
        run: |
          poetry run python - <<'PY'
          import hashlib
          import os
          from urllib.request import urlopen
          from backend.players.artifacts import install_runtime_bundle
          from backend.model.preseason import install_preseason_runtime_bundle
          for prefix, install in (
              ('OPENING_FORECAST', install_preseason_runtime_bundle),
              ('PLAYER_RUNTIME', install_runtime_bundle),
          ):
              url = os.environ[f'{prefix}_BUNDLE_URL']
              if not url:
                  continue
              expected = os.environ[f'{prefix}_BUNDLE_SHA256']
              if not url.startswith('https://') or len(expected) != 64:
                  raise ValueError('Runtime bootstrap requires HTTPS and a reviewed SHA256')
              with urlopen(url, timeout=60) as response:
                  bundle = response.read(10_000_001)
              if len(bundle) > 10_000_000 or hashlib.sha256(bundle).hexdigest() != expected:
                  raise ValueError('Runtime bundle checksum or size is invalid')
              install(bundle, int(os.environ['SEASON']))
          PY

      - name: Validate trained Heisman model before CFBD calls
        run: |
          poetry run python -c 'import os; from backend.players.artifacts import load_heisman_model; load_heisman_model(int(os.environ["SEASON"]))'
          poetry run python -c 'from backend.etl import store; from backend.model.ingame import load_baseline_params; load_baseline_params(store.read_processed("ingame", "baseline_summary.parquet"))'

      - name: Validate frozen preseason state before CFBD calls
        run: |
          poetry run python -c 'import os; from backend.etl import store; from backend.model.preseason import load_score_noise_prior, scoring_priors_from_ratings; season = int(os.environ["SEASON"]); scoring_priors_from_ratings(store.read_preseason_forecast_artifact(season, 1, "ratings"), load_score_noise_prior(season))'

      - name: Verify required secrets
        shell: bash
        run: |
          missing=()
          for secret_name in CFBD_API_KEY ODDS_API_KEY DATABASE_URL; do
            if [[ -z "${!secret_name}" ]]; then
              missing+=("$secret_name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run weekly regression gate
        run: poetry run pytest tests/test_joint_scoring.py -q

      - name: Refresh season data from CFBD
        run: poetry run python -m backend ingest --seasons "$SEASON" --max-calls "$CFBD_MAX_CALLS"

      - name: Rebuild features
        run: poetry run python -m backend features --seasons "$SEASON"

      - name: Retrain and publish next week
        shell: bash
        env:
          MOMENTUMCFB_DB_WRITES: "1"
        run: |
          arguments=(--season "$SEASON")
          if [[ -n "$FORECAST_WEEK" ]]; then
            arguments+=(--week "$FORECAST_WEEK")
          fi
          poetry run python -m backend weekly-update "${arguments[@]}"

      # Grading reads only frozen records: the projection the site published
      # before kickoff, the CFBD closing line, and the final score. It runs
      # after the forecast so a not-ready week still grades completed games.
      - name: Grade completed games and publish performance
        shell: bash
        env:
          MOMENTUMCFB_DB_WRITES: "1"
        run: |
          poetry run python -m backend grade --season "$SEASON"
          poetry run python -m backend publish-grading --season "$SEASON"

      # A model artifact contains coefficients, version/seed provenance and
      # chronological weekly evaluation. Historical raw data is never fetched
      # or used to retrain implicitly on a fresh production runner.
      - name: Preserve validated player runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: heisman-model-${{ env.SEASON }}
          path: |
            backend/data/processed/players/models/heisman_${{ env.SEASON }}.json
            backend/data/processed/ingame/baseline_summary.parquet
          if-no-files-found: error
          retention-days: 90

      # Only completed schedule weeks and their active FBS conferences are
      # fetched, with a hard shared job budget and durable per-chunk resume.
      - name: Update player value and the Heisman board
        shell: bash
        env:
          MOMENTUMCFB_DB_WRITES: "1"
        run: |
          poetry run python -m backend ingest-players --seasons "$SEASON" --max-calls "$CFBD_MAX_CALLS"
          poetry run python -m backend player-values --seasons "$SEASON"
          poetry run python -m backend heisman --season "$SEASON"
          poetry run python -m backend publish-players --season "$SEASON"

      - name: Preserve player checkpoints even after partial failure
        if: always() && steps.player-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            backend/data/raw/players/${{ env.SEASON }}/
            backend/data/processed/players/models/
            backend/data/processed/ingame/baseline_summary.parquet
          key: ${{ steps.player-cache.outputs.cache-primary-key }}

      - name: Preserve frozen preseason forecast
        if: always() && steps.preseason-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            backend/data/processed/preseason/ratings/
            backend/data/processed/preseason/score_noise_prior/
            backend/data/processed/preseason/forecast_log/
          key: ${{ steps.preseason-cache.outputs.cache-primary-key }}

      - name: Preserve forecast audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-cfb-${{ github.run_id }}
          path: backend/data/processed/weekly/forecast_log/
          if-no-files-found: ignore
          retention-days: 90
