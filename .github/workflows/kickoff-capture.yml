name: Opening kickoff capture

on:
  # Supabase pg_cron dispatches only the market-capture window.
  # The frozen pregame forecast is restored from the explicitly named
  # successful forecast run and is never rebuilt or republished here.
  repository_dispatch:
    types: [kickoff-capture]
  workflow_dispatch:
    inputs:
      season:
        description: Optional season override
        required: false
        type: string
      forecast_run_id:
        description: Successful opening forecast run containing the frozen artifacts
        required: true
        type: string
      forecast_artifact:
        description: Exact artifact name produced by that forecast run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: kickoff-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      REQUESTED_SEASON: ${{ github.event.client_payload.season || inputs.season }}
      FORECAST_RUN_ID: ${{ github.event.client_payload.forecast_run_id || inputs.forecast_run_id }}
      FORECAST_ARTIFACT: ${{ github.event.client_payload.forecast_artifact || inputs.forecast_artifact }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_API_BOOKMAKERS: ${{ secrets.ODDS_API_BOOKMAKERS }}
      ODDS_API_REGIONS: ${{ secrets.ODDS_API_REGIONS }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install poetry==2.1.3
          poetry install --no-root --no-interaction --no-ansi

      - name: Resolve frozen forecast inputs
        shell: bash
        run: |
          if [[ -n "$REQUESTED_SEASON" ]]; then
            season="$REQUESTED_SEASON"
          else
            calendar_year=$(date -u +%Y)
            calendar_month=$(date -u +%m)
            if [[ "$calendar_month" == "01" ]]; then
              season=$((calendar_year - 1))
            else
              season="$calendar_year"
            fi
          fi
          if [[ ! "$FORECAST_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "forecast_run_id must identify one successful forecast run"
            exit 1
          fi
          if [[ ! "$FORECAST_ARTIFACT" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "forecast_artifact contains unsupported characters"
            exit 1
          fi
          echo "SEASON=$season" >> "$GITHUB_ENV"

      - name: Restore the frozen pregame forecast
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.FORECAST_ARTIFACT }}
          path: backend/data
          repository: ${{ github.repository }}
          run-id: ${{ env.FORECAST_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify required secrets
        shell: bash
        run: |
          missing=()
          for secret_name in ODDS_API_KEY DATABASE_URL; do
            if [[ -z "${!secret_name}" ]]; then
              missing+=("$secret_name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run live odds regression gate
        run: poetry run pytest tests/test_live_odds.py -q

      # A fresh runner needs one provider snapshot for market coverage and
      # quota provenance before the fail-closed kickoff window is planned.
      - name: Bootstrap the live odds store
        run: >-
          poetry run python -m backend live-odds
          --season "$SEASON" --polls 1 --min-quota 20

      - name: Capture the kickoff window
        run: >-
          poetry run python -m backend kickoff-run
          --season "$SEASON" --max-wait-hours 4 --min-quota 20
          --max-forecast-age-hours 240 --max-source-age-hours 240

      - name: Prove the frozen market anchors
        run: |
          poetry run python -m backend serving-anchors \
            --season "$SEASON" --source market --market-feed live-odds
          poetry run python -m backend live-replay --season "$SEASON"

      - name: Publish market serving anchors
        env:
          MOMENTUMCFB_DB_WRITES: "1"
        run: poetry run python -m backend publish-anchors --season "$SEASON" --week 0

      - name: Preserve capture audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kickoff-capture-${{ github.run_id }}
          path: |
            backend/data/processed/serving/
            backend/data/raw/live_odds/
          if-no-files-found: ignore
          retention-days: 90
