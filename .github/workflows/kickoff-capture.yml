name: Opening kickoff capture

on:
  schedule:
    # Friday evening runs publish the final pre-kickoff forecast so the
    # site's lines are up the night before. Saturday runs refresh again,
    # then poll across the first market-covered kickoff window to freeze
    # the closing spread. Week 1 spans two weekends, so each gets a pair.
    - cron: "0 23 28 8 *"
    - cron: "30 13 29 8 *"
    - cron: "0 23 4 9 *"
    - cron: "30 13 5 9 *"
  workflow_dispatch:
    inputs:
      mode:
        description: forecast publishes lines only; capture also freezes the kickoff window
        required: true
        type: choice
        options:
          - forecast
          - capture
      season:
        description: Optional season override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: kickoff-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      REQUESTED_SEASON: ${{ inputs.season }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_API_BOOKMAKERS: ${{ secrets.ODDS_API_BOOKMAKERS }}
      ODDS_API_REGIONS: ${{ secrets.ODDS_API_REGIONS }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install poetry==2.1.3
          poetry install --no-root --no-interaction --no-ansi

      - name: Resolve mode and season
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          else
            case "${{ github.event.schedule }}" in
              "30 13 "*) mode="capture" ;;
              *) mode="forecast" ;;
            esac
          fi
          echo "MODE=$mode" >> "$GITHUB_ENV"
          if [[ -n "$REQUESTED_SEASON" ]]; then
            season="$REQUESTED_SEASON"
          else
            calendar_year=$(date -u +%Y)
            calendar_month=$(date -u +%m)
            if [[ "$calendar_month" == "01" ]]; then
              season=$((calendar_year - 1))
            else
              season="$calendar_year"
            fi
          fi
          echo "SEASON=$season" >> "$GITHUB_ENV"

      - name: Verify required secrets
        shell: bash
        run: |
          missing=()
          for secret_name in CFBD_API_KEY ODDS_API_KEY DATABASE_URL; do
            if [[ -z "${!secret_name}" ]]; then
              missing+=("$secret_name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run live odds regression gate
        run: poetry run pytest tests/test_live_odds.py -q

      # The preseason forecast carries the prior season's final fit forward,
      # so an ephemeral runner must rebuild that season's games and features
      # from CFBD before forecasting.
      - name: Rebuild prior season inputs
        shell: bash
        run: |
          prior=$((SEASON - 1))
          poetry run python -m backend ingest --seasons "$prior"
          poetry run python -m backend features --seasons "$prior"

      # --with-odds-api buys the two-market Odds API snapshot (2 credits):
      # the adopted market source for the pre-kickoff comparison; the CFBD
      # lines feed alone covers too few games and carries no timestamps.
      - name: Build the pre-kickoff forecast
        run: >-
          poetry run python -m backend preseason
          --season "$SEASON" --refresh --with-odds-api

      - name: Rebuild week 1 serving anchors
        run: >-
          poetry run python -m backend serving-anchors
          --season "$SEASON" --week 1 --source preseason

      - name: Publish serving tables
        run: >-
          poetry run python -m backend publish
          --season "$SEASON" --week 1 --skip-backtest

      - name: Publish week 1 serving anchors
        run: poetry run python -m backend publish-anchors --season "$SEASON" --week 1

      # The kickoff preflight needs at least one stored poll for target
      # resolution, provider coverage, and quota provenance; a fresh runner
      # starts empty, so seed the append-only store with a single poll.
      - name: Bootstrap the live odds store
        if: env.MODE == 'capture'
        run: >-
          poetry run python -m backend live-odds
          --season "$SEASON" --polls 1 --min-quota 40

      # min-quota 40 instead of the default 50: the opening capture is the
      # purpose of the remaining opening-week quota, so give the window
      # headroom for retries rather than aborting a poll short.
      - name: Capture the kickoff window
        if: env.MODE == 'capture'
        run: >-
          poetry run python -m backend kickoff-run
          --season "$SEASON" --max-wait-hours 4 --min-quota 40

      - name: Prove the frozen market anchors
        if: env.MODE == 'capture'
        run: |
          poetry run python -m backend serving-anchors \
            --season "$SEASON" --source market --market-feed live-odds
          poetry run python -m backend live-replay --season "$SEASON"

      - name: Publish market serving anchors
        if: env.MODE == 'capture'
        run: poetry run python -m backend publish-anchors --season "$SEASON" --week 0

      - name: Preserve audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kickoff-${{ env.MODE }}-${{ github.run_id }}
          path: |
            backend/data/processed/preseason/forecast_log/
            backend/data/processed/serving/
            backend/data/raw/live_odds/
          if-no-files-found: ignore
          retention-days: 90
