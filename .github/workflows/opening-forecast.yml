name: Opening forecast publication

on:
  # Opening forecasts are intentional release operations, not retry crons.
  # Run this early enough for the independent model lines to be useful.
  workflow_dispatch:
    inputs:
      season:
        description: Optional season override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: opening-forecast-publication
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REQUESTED_SEASON: ${{ inputs.season }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_API_BOOKMAKERS: ${{ secrets.ODDS_API_BOOKMAKERS }}
      ODDS_API_REGIONS: ${{ secrets.ODDS_API_REGIONS }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install poetry==2.1.3
          poetry install --no-root --no-interaction --no-ansi

      - name: Resolve season
        shell: bash
        run: |
          if [[ -n "$REQUESTED_SEASON" ]]; then
            season="$REQUESTED_SEASON"
          else
            calendar_year=$(date -u +%Y)
            calendar_month=$(date -u +%m)
            if [[ "$calendar_month" == "01" ]]; then
              season=$((calendar_year - 1))
            else
              season="$calendar_year"
            fi
          fi
          echo "SEASON=$season" >> "$GITHUB_ENV"

      - name: Verify required secrets
        shell: bash
        run: |
          missing=()
          for secret_name in CFBD_API_KEY ODDS_API_KEY DATABASE_URL; do
            if [[ -z "${!secret_name}" ]]; then
              missing+=("$secret_name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run forecast regression gates
        run: |
          poetry run pytest tests/test_joint_scoring.py -q
          poetry run pytest tests/test_live_odds.py -q

      # The preseason forecast carries the prior season's final fit forward,
      # so an ephemeral runner must rebuild that season before forecasting.
      - name: Rebuild prior season inputs
        shell: bash
        run: |
          prior=$((SEASON - 1))
          poetry run python -m backend ingest --seasons "$prior"
          poetry run python -m backend features --seasons "$prior"

      - name: Build the opening forecast
        run: >-
          poetry run python -m backend preseason
          --season "$SEASON" --refresh --with-odds-api

      - name: Build week 1 serving anchors
        run: >-
          poetry run python -m backend serving-anchors
          --season "$SEASON" --week 1 --source preseason

      - name: Publish serving tables
        env:
          MOMENTUMCFB_DB_WRITES: "1"
        run: >-
          poetry run python -m backend publish
          --season "$SEASON" --week 1 --skip-backtest

      - name: Publish week 1 serving anchors
        env:
          MOMENTUMCFB_DB_WRITES: "1"
        run: poetry run python -m backend publish-anchors --season "$SEASON" --week 1

      - name: Preserve the frozen forecast and capture inputs
        uses: actions/upload-artifact@v7
        with:
          name: opening-forecast-${{ github.run_id }}
          path: |
            backend/data/raw/preseason/*/games.parquet
            backend/data/processed/preseason/forecast_log/
            backend/data/processed/serving/
          if-no-files-found: error
          retention-days: 90
