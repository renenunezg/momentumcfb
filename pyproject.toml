[project]
name = "momentumcfb"
version = "0.2.0"
description = "College football power ratings"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Rene Nunez", email = "renenunezgalaviz@gmail.com" },
]
dependencies = [
    "pandas>=2.3,<3.0",
    "numpy>=2.4,<3.0",
    "pyarrow>=17.0,<18.0",
    "requests>=2.32,<3.0",
    "python-dotenv>=1.1,<2.0",
    "scipy>=1.17,<2.0",
    "sqlalchemy>=2.0.52,<3.0",
    "psycopg2-binary>=2.9.12,<3.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = ">=0.11,<1.0"
mypy = ">=1.15,<2.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: long model fits"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["backend/data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = [
    "backend/cfbd",
    "backend/commands",
    "backend/db.py",
    "backend/model/outputs.py",
    "backend/odds/client.py",
    "backend/serving",
]
follow_imports = "skip"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
